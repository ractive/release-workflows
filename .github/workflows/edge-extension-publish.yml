# Reusable: publish a Chromium extension's store zip from a GitHub release to
# its Microsoft Edge Add-ons item, and submit it for certification.
#
# One job, in the caller's environment (`environment`, default edge-add-ons),
# which holds the Partner Center Publish API credentials (v1.1) as
# environment secrets (the caller passes `secrets: inherit`, or the job sees
# none of them) and should have required reviewers and a tag-only rule:
#
#   EDGE_CLIENT_ID   the Client ID on Partner Center → Microsoft Edge →
#                    Publish API
#   EDGE_API_KEY     an API key from the same page; keys have an expiry date
#                    shown there, and "Create API credentials" makes a new one
#
# The item must exist (the API updates items, it cannot create one); its
# Product ID (a GUID, Extension overview → Extension identity) is the input
# product-id. Edge takes the zip as it is: no CRX, no signed uploads.
#
# Nothing third-party runs in this job: no checkout, no package install, no
# marketplace action; the Edge Add-ons API is called with curl. The checks
# before the upload are chrome-extension-publish.yml's.
#
# Self-contained on purpose: a reusable workflow runs against the caller's
# checkout, so a script of this repository could not be referenced (README,
# "Why fully self-contained").

name: Edge extension publish

on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to publish (the caller's github.ref_name); unused in dry-run"
        type: string
        default: ""
      tag-prefix:
        description: "What precedes the version in the tag, e.g. v or extension-v"
        type: string
        default: "v"
      asset:
        description: "The release asset to publish, with {version} for the version, e.g. sitegloss-{version}-store.zip"
        type: string
        default: ""
      product-id:
        description: "The Edge Add-ons item's Product ID (a GUID)"
        type: string
        default: ""
      attest-signer-workflow:
        description: "If set, the zip's build provenance must verify as signed by this workflow of the caller's repository for the tag, e.g. .github/workflows/release.yml"
        type: string
        default: ""
      allow-host-permissions:
        description: "Allow install-time host access in the manifest (host_permissions, content_scripts matches, URL patterns in permissions); off by default"
        type: boolean
        default: false
      notes:
        description: "Notes for certification sent with the submission (plain text, at most 2000 characters); empty: a line naming the release"
        type: string
        default: ""
      submit:
        description: "Submit for certification after the upload; false leaves the package in the draft"
        type: boolean
        default: true
      environment:
        description: "The caller's environment with the Publish API secrets"
        type: string
        default: edge-add-ons
      dry-run:
        description: "Check the artifact's store.zip only; no release, no store"
        type: boolean
        default: false
      dry-run-artifact:
        description: "The artifact a dry run takes its zip from"
        type: string
        default: ""

# No permissions block: the job takes the caller's grant (contents: read, and
# attestations: read with attest-signer-workflow); see README, "Required
# caller permissions".

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    # One upload at a time per repository (see chrome-extension-publish.yml);
    # a dry run touches no store and gets a group of its own.
    concurrency:
      group: ${{ inputs.dry-run && format('edge-dry-run-{0}-{1}', github.run_id, github.run_attempt) || format('edge-add-ons-{0}', github.repository) }}
      cancel-in-progress: false
    steps:
      - name: The tag and the inputs
        id: inputs
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ inputs.tag }}
          PREFIX: ${{ inputs.tag-prefix }}
          ASSET: ${{ inputs.asset }}
          PRODUCT_ID: ${{ inputs.product-id }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          # Only a run on the release's own tag uploads that tag's zip.
          test "$GITHUB_REF_TYPE" = tag && test "$GITHUB_REF_NAME" = "$TAG" \
            || { echo "::error::this run is on $GITHUB_REF_TYPE $GITHUB_REF_NAME, not on the tag '$TAG'"; exit 1; }
          case "$TAG" in "$PREFIX"*) ;; *) echo "::error::$TAG does not start with $PREFIX"; exit 1 ;; esac
          version="${TAG#"$PREFIX"}"
          # Chromium takes 1 to 4 dot-separated integers from 0 to 65535, no leading zeros.
          if ! echo "$version" | grep -Eq '^(0|[1-9][0-9]{0,4})(\.(0|[1-9][0-9]{0,4})){0,3}$' \
            || ! echo "$version" | awk -F. '{ for (i = 1; i <= NF; i++) if ($i > 65535) exit 1 }'; then
            echo "::error::$TAG is not $PREFIX plus an extension version"; exit 1
          fi
          case "$ASSET" in *"{version}"*) ;; *) echo "::error::asset '$ASSET' has no {version}"; exit 1 ;; esac
          echo "$PRODUCT_ID" | grep -Eiq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' \
            || { echo "::error::product-id '$PRODUCT_ID' is not a Product ID (a GUID)"; exit 1; }
          test "${#NOTES}" -le 2000 || { echo "::error::notes has ${#NOTES} characters, at most 2000"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET//\{version\}/$version}" >> "$GITHUB_OUTPUT"

      - name: Download the release's store zip
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ steps.inputs.outputs.asset }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --output store.zip
          sha256sum store.zip

      - name: Download the dry run's zip
        if: ${{ inputs.dry-run }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.dry-run-artifact }}

      - name: The zip is a store build of that version
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          ALLOW_HOST_PERMISSIONS: ${{ inputs.allow-host-permissions }}
        run: |
          set -euo pipefail
          manifest="$(unzip -p store.zip manifest.json)"
          if [ -n "$VERSION" ]; then
            test "$(jq -r .version <<<"$manifest")" = "$VERSION" \
              || { echo "::error::the manifest's version is not $VERSION"; exit 1; }
          fi
          jq -e 'has("key") | not' <<<"$manifest" >/dev/null \
            || { echo "::error::the manifest has a key: not a store build"; exit 1; }
          if [ "$ALLOW_HOST_PERMISSIONS" != true ]; then
            # Install-time host access: host_permissions, the sites content
            # scripts run on, and (Manifest V2) URL patterns in permissions.
            hosts="$(jq -c '[(.host_permissions // [])[],
                (.content_scripts // [])[].matches[]?,
                ((.permissions // [])[] | select(type == "string" and test("://|^<all_urls>$")))]' <<<"$manifest")"
            test "$hosts" = '[]' \
              || { echo "::error::the manifest asks for host access at install: $hosts (allow-host-permissions is off)"; exit 1; }
          fi
          # grep -c reads all of its input, so unzip never gets SIGPIPE.
          maps="$(unzip -Z1 store.zip | grep -c '\.map$' || true)"
          test "$maps" = 0 || { echo "::error::the zip has $maps source maps"; exit 1; }

      - name: The zip's attestation verifies
        if: ${{ !inputs.dry-run && inputs.attest-signer-workflow != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER: ${{ inputs.attest-signer-workflow }}
        run: |
          set -euo pipefail
          gh attestation verify store.zip --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/$SIGNER" --source-ref "$GITHUB_REF"

      - name: Upload to Edge Add-ons
        if: ${{ !inputs.dry-run }}
        env:
          CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          API_KEY: ${{ secrets.EDGE_API_KEY }}
          PRODUCT_ID: ${{ inputs.product-id }}
          SUBMIT: ${{ inputs.submit }}
          VERSION: ${{ steps.inputs.outputs.version }}
          NOTES: ${{ inputs.notes }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for name in CLIENT_ID API_KEY; do
            test -n "${!name}" || { echo "::error::EDGE_$name is not set (environment secret, and the caller passes secrets: inherit)"; exit 1; }
          done
          umask 077
          auth="$RUNNER_TEMP/edge-auth"
          headers="$RUNNER_TEMP/edge-headers"
          body="$RUNNER_TEMP/edge-body"
          trap 'rm -f "$auth" "$headers" "$body"' EXIT
          echo "::add-mask::$API_KEY"
          # The key stays in a file, so it is in no command line.
          printf 'Authorization: ApiKey %s\nX-ClientID: %s\n' "$API_KEY" "$CLIENT_ID" > "$auth"
          api="https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT_ID/submissions"

          # Microsoft's errorCode and message from the last answer, if any.
          reason() { jq -r '[.errorCode, .message] | map(select(. != null and . != "")) | join(": ")' "$body" 2>/dev/null || head -c 500 "$body"; }

          # POSTs to $1 (with curl's further arguments) and sets operation_id from
          # the 202's Location header (an id, or a path ending in it). Anything
          # else fails with the HTTP status and Microsoft's answer.
          start() {
            local what="$1" url="$2" code; shift 2
            code="$(curl -sS --connect-timeout 20 --max-time 300 -D "$headers" -o "$body" -w '%{http_code}' \
              -X POST "$url" -H @"$auth" "$@")" || code="${code:-000}"
            if [ "$code" != 202 ]; then
              echo "::error::$what answered HTTP $code, not 202: $(reason)"
              return 1
            fi
            operation_id="$(sed -n 's/^[Ll]ocation: *//p' "$headers" | tr -d '\r' | tail -1 | sed 's#.*/##')"
            test -n "$operation_id" || { echo "::error::$what's answer has no operation id"; return 1; }
          }

          # Asks for an operation's status until it is no longer InProgress, at
          # most 8 minutes (both operations fit the job's timeout). A network
          # error, 408, 429 or 5xx is asked again next round; any other HTTP
          # error ends it at once (an expired key answers 401). A 202 means
          # still in progress: Microsoft's reference names only 200 with
          # "InProgress" in the body, but the API answers 202 with an empty
          # body while the operation runs, as its sample script expects.
          wait_for() {
            local what="$1" url="$2" code status=""
            for _ in $(seq 1 48); do
              code="$(curl -sS --connect-timeout 20 --max-time 60 -o "$body" -w '%{http_code}' "$url" -H @"$auth")" || code=000
              case "$code" in
                200) status="$(jq -r '.status // empty' "$body" 2>/dev/null || true)"
                     [ "$status" = InProgress ] || break ;;
                202) status=InProgress; echo "status answered HTTP 202: still in progress" ;;
                000|408|429|5??) echo "status answered HTTP $code; asking again" ;;
                *) echo "::error::$what's status answered HTTP $code: $(reason)"; return 1 ;;
              esac
              sleep 10
            done
            jq . "$body" 2>/dev/null || true
            test "$status" = Succeeded || {
              echo "::error::$what ended in '${status:-no answer}': $(reason)"
              return 1
            }
          }
          in_review() {
            grep -q InProgressSubmission "$body" 2>/dev/null \
              && echo "::notice::InProgressSubmission: a version is still in certification; run the publish again by hand after it."
            return 1
          }

          echo "uploading store.zip ($VERSION)"
          start "the upload" "$api/draft/package" -H 'Content-Type: application/zip' --data-binary @store.zip
          wait_for "the upload" "$api/draft/package/operations/$operation_id"

          if [ "$SUBMIT" = true ]; then
            notes="${NOTES:-Release $TAG of $GITHUB_REPOSITORY: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG}"
            start "the submission" "$api" -H 'Content-Type: application/json' \
              --data "$(jq -n --arg notes "$notes" '{notes: $notes}')" || in_review
            wait_for "the submission" "$api/operations/$operation_id" || in_review
            echo "submitted $VERSION for certification" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "uploaded $VERSION to the draft; submit it in Partner Center" >> "$GITHUB_STEP_SUMMARY"
          fi
