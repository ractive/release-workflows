# Reusable: publish a Firefox extension's store zip from a GitHub release to
# its add-on on addons.mozilla.org (AMO), as a new listed version submitted
# for review, with the release's source-code archive attached.
#
# One job, in the caller's environment (`environment`, default
# firefox-add-ons), which holds the AMO API credentials as environment
# secrets (the caller passes `secrets: inherit`, or the job sees none of
# them) and should have required reviewers and a tag-only rule:
#
#   AMO_JWT_ISSUER   the "JWT issuer" on AMO → Developer Hub → Manage API
#                    Keys (https://addons.mozilla.org/developers/addon/api/key/)
#   AMO_JWT_SECRET   the "JWT secret" from the same page
#
# The add-on must exist on AMO with its listing (name, summary, categories,
# licence): this workflow adds versions, it does not create add-ons. Its id
# is the manifest's browser_specific_settings.gecko.id, the input addon-id.
#
# AMO's reviewers need the source of bundled or minified JavaScript and the
# steps to build it (Extension Workshop, "Source code submission"): the input
# source-asset names that archive, attached to the same version.
#
# Nothing third-party runs in this job: no checkout, no package install, no
# marketplace action, no web-ext. AMO's API v5 is called with curl, each
# request with a JWT of its own made by the Python below (standard library).
# The checks before the upload are chrome-extension-publish.yml's, plus the
# manifest's gecko id.
#
# Self-contained on purpose: a reusable workflow runs against the caller's
# checkout, so a script of this repository could not be referenced (README,
# "Why fully self-contained").

name: Firefox extension publish

on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to publish (the caller's github.ref_name); unused in dry-run"
        type: string
        default: ""
      tag-prefix:
        description: "What precedes the version in the tag, e.g. v or extension-v"
        type: string
        default: "v"
      asset:
        description: "The release asset to publish, with {version} for the version, e.g. sitegloss-firefox-{version}-store.zip"
        type: string
        default: ""
      source-asset:
        description: "The release asset with the source code for AMO's reviewers (.zip, .tar.gz, .tgz or .tar.bz2), with {version}; empty attaches no source"
        type: string
        default: ""
      addon-id:
        description: "The add-on's id on AMO, its manifest's browser_specific_settings.gecko.id, e.g. sitegloss@ractive.ch"
        type: string
        default: ""
      attest-signer-workflow:
        description: "If set, the zip's (and the source archive's) build provenance must verify as signed by this workflow of the caller's repository for the tag, e.g. .github/workflows/release.yml"
        type: string
        default: ""
      allow-host-permissions:
        description: "Allow install-time host access in the manifest (host_permissions, content_scripts matches, URL patterns in permissions); off by default"
        type: boolean
        default: false
      notes:
        description: "Notes for AMO's reviewers sent with the version (plain text, at most 3000 characters, only Mozilla sees them); empty: a line naming the release"
        type: string
        default: ""
      environment:
        description: "The caller's environment with the AMO API secrets"
        type: string
        default: firefox-add-ons
      dry-run:
        description: "Check the artifact's store.zip (and source/ archive) only; no release, no store"
        type: boolean
        default: false
      dry-run-artifact:
        description: "The artifact a dry run takes its zip from"
        type: string
        default: ""

# No permissions block: the job takes the caller's grant (contents: read, and
# attestations: read with attest-signer-workflow); see README, "Required
# caller permissions".

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    # One upload at a time per repository (see chrome-extension-publish.yml);
    # a dry run touches no store and gets a group of its own.
    concurrency:
      group: ${{ inputs.dry-run && format('amo-dry-run-{0}-{1}', github.run_id, github.run_attempt) || format('firefox-add-ons-{0}', github.repository) }}
      cancel-in-progress: false
    steps:
      - name: The tag and the inputs
        id: inputs
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ inputs.tag }}
          PREFIX: ${{ inputs.tag-prefix }}
          ASSET: ${{ inputs.asset }}
          SOURCE_ASSET: ${{ inputs.source-asset }}
          ADDON_ID: ${{ inputs.addon-id }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          # Only a run on the release's own tag uploads that tag's zip.
          test "$GITHUB_REF_TYPE" = tag && test "$GITHUB_REF_NAME" = "$TAG" \
            || { echo "::error::this run is on $GITHUB_REF_TYPE $GITHUB_REF_NAME, not on the tag '$TAG'"; exit 1; }
          case "$TAG" in "$PREFIX"*) ;; *) echo "::error::$TAG does not start with $PREFIX"; exit 1 ;; esac
          version="${TAG#"$PREFIX"}"
          # Firefox takes 1 to 4 dot-separated integers of at most 9 digits, no leading zeros.
          echo "$version" | grep -Eq '^(0|[1-9][0-9]{0,8})(\.(0|[1-9][0-9]{0,8})){0,3}$' \
            || { echo "::error::$TAG is not $PREFIX plus a Firefox extension version"; exit 1; }
          case "$ASSET" in *"{version}"*) ;; *) echo "::error::asset '$ASSET' has no {version}"; exit 1 ;; esac
          if [ -n "$SOURCE_ASSET" ]; then
            case "$SOURCE_ASSET" in *"{version}"*) ;; *) echo "::error::source-asset '$SOURCE_ASSET' has no {version}"; exit 1 ;; esac
            source_asset="${SOURCE_ASSET//\{version\}/$version}"
            # A plain file name: it is a gh pattern and a curl form value.
            echo "$source_asset" | grep -Eq '^[A-Za-z0-9._+-]+\.(zip|tar\.gz|tgz|tar\.bz2)$' \
              || { echo "::error::source-asset '$source_asset' is not a file name ending in .zip, .tar.gz, .tgz or .tar.bz2 (what AMO takes)"; exit 1; }
            echo "source-asset=$source_asset" >> "$GITHUB_OUTPUT"
          fi
          # A gecko id is an email-like id or a GUID in braces.
          echo "$ADDON_ID" | grep -Eq '^([A-Za-z0-9._-]*@[A-Za-z0-9._-]+|\{[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\})$' \
            || { echo "::error::addon-id '$ADDON_ID' is not a gecko id (name@domain or {GUID})"; exit 1; }
          test "${#NOTES}" -le 3000 || { echo "::error::notes has ${#NOTES} characters, at most 3000"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET//\{version\}/$version}" >> "$GITHUB_OUTPUT"

      - name: Download the release's store zip
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ steps.inputs.outputs.asset }}
          SOURCE_ASSET: ${{ steps.inputs.outputs.source-asset }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --output store.zip
          sha256sum store.zip
          if [ -n "$SOURCE_ASSET" ]; then
            # Under its own name, which AMO keeps and its reviewers see.
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_ASSET" --dir source
            sha256sum source/*
          fi

      - name: Download the dry run's zip
        if: ${{ inputs.dry-run }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.dry-run-artifact }}

      - name: The zip is a store build of that version and add-on
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          ADDON_ID: ${{ inputs.addon-id }}
          ALLOW_HOST_PERMISSIONS: ${{ inputs.allow-host-permissions }}
        run: |
          set -euo pipefail
          manifest="$(unzip -p store.zip manifest.json)"
          if [ -n "$VERSION" ]; then
            test "$(jq -r .version <<<"$manifest")" = "$VERSION" \
              || { echo "::error::the manifest's version is not $VERSION"; exit 1; }
          fi
          # AMO files the upload under the manifest's id; another id would
          # be refused only after the upload, or make a different add-on.
          id="$(jq -r '.browser_specific_settings.gecko.id // .applications.gecko.id // empty' <<<"$manifest")"
          test -n "$id" || { echo "::error::the manifest has no browser_specific_settings.gecko.id"; exit 1; }
          if [ -n "$ADDON_ID" ]; then
            test "$id" = "$ADDON_ID" \
              || { echo "::error::the manifest's gecko id is $id, addon-id says $ADDON_ID"; exit 1; }
          fi
          jq -e 'has("key") | not' <<<"$manifest" >/dev/null \
            || { echo "::error::the manifest has a key: not a store build"; exit 1; }
          if [ "$ALLOW_HOST_PERMISSIONS" != true ]; then
            # Install-time host access: host_permissions, the sites content
            # scripts run on, and (Manifest V2) URL patterns in permissions.
            hosts="$(jq -c '[(.host_permissions // [])[],
                (.content_scripts // [])[].matches[]?,
                ((.permissions // [])[] | select(type == "string" and test("://|^<all_urls>$")))]' <<<"$manifest")"
            test "$hosts" = '[]' \
              || { echo "::error::the manifest asks for host access at install: $hosts (allow-host-permissions is off)"; exit 1; }
          fi
          # grep -c reads all of its input, so unzip never gets SIGPIPE.
          maps="$(unzip -Z1 store.zip | grep -c '\.map$' || true)"
          test "$maps" = 0 || { echo "::error::the zip has $maps source maps"; exit 1; }

      - name: The source archive is one AMO takes
        if: ${{ inputs.dry-run || inputs.source-asset != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(source/*)
          if [ "${#files[@]}" = 0 ]; then
            echo "no source archive (a dry run's artifact without source/)"; exit 0
          fi
          test "${#files[@]}" = 1 || { echo "::error::more than one file in source/: ${files[*]}"; exit 1; }
          file="${files[0]}"
          # AMO opens it on submission (a zip's CRCs too) and refuses a broken
          # one; open it here first.
          case "$file" in
            *.zip) list="$(unzip -Z1 "$file")" && unzip -tq "$file" >/dev/null ;;
            *.tar.gz|*.tgz) list="$(tar -tzf "$file")" ;;
            *.tar.bz2) list="$(tar -tjf "$file")" ;;
            *) echo "::error::$file is not .zip, .tar.gz, .tgz or .tar.bz2"; exit 1 ;;
          esac || { echo "::error::$file is not a readable archive"; exit 1; }
          echo "$file: $(wc -l <<<"$list") entries"
          # The reviewers build from it, so the steps should be inside.
          grep -Eiq '^([^/]+/)?readme' <<<"$list" \
            || echo "::warning::$file has no README at its top: AMO's reviewers need the build steps"

      - name: The zip's attestation verifies
        if: ${{ !inputs.dry-run && inputs.attest-signer-workflow != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER: ${{ inputs.attest-signer-workflow }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The store zip and the source archive, if any: both go to AMO.
          for file in store.zip source/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/$SIGNER" --source-ref "$GITHUB_REF"
          done

      - name: Upload to AMO and submit for review
        if: ${{ !inputs.dry-run }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          ADDON_ID: ${{ inputs.addon-id }}
          VERSION: ${{ steps.inputs.outputs.version }}
          SOURCE_ASSET: ${{ steps.inputs.outputs.source-asset }}
          NOTES: ${{ inputs.notes }}
          TAG: ${{ inputs.tag }}
          AMO_API: https://addons.mozilla.org/api/v5
        run: |
          set -euo pipefail
          for name in AMO_JWT_ISSUER AMO_JWT_SECRET; do
            test -n "${!name}" || { echo "::error::$name is not set (environment secret, and the caller passes secrets: inherit)"; exit 1; }
          done
          umask 077
          auth="$RUNNER_TEMP/amo-auth"
          body="$RUNNER_TEMP/amo-body"
          trap 'rm -f "$auth" "$body"' EXIT
          echo "::add-mask::$AMO_JWT_SECRET"
          # The id in a URL path: percent-encoded (sitegloss%40ractive.ch,
          # %7B…%7D for a GUID); AMO decodes it.
          addon="$AMO_API/addons/addon/$(jq -rn --arg id "$ADDON_ID" '$id | @uri')"

          # A token for one request (AMO: a JWT per request, HS256 with the
          # secret, iss the issuer, a unique jti, exp at most 5 minutes after
          # iat). iat is 30 s back, as a runner clock ahead of AMO's would
          # make it "in the future"; exp is the limit, as AMO checks the token
          # once it has the whole body, so no request may take longer than
          # 4 minutes (curl's --max-time below).
          token() {
            python3 -I - <<'PY'
          import base64, hashlib, hmac, json, os, secrets, time

          def b64(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          def part(obj):
              return b64(json.dumps(obj, separators=(",", ":")).encode())

          iat = int(time.time()) - 30
          claims = {"iss": os.environ["AMO_JWT_ISSUER"], "jti": secrets.token_hex(16),
                    "iat": iat, "exp": iat + 300}
          signing_input = part({"alg": "HS256", "typ": "JWT"}) + "." + part(claims)
          signature = hmac.new(os.environ["AMO_JWT_SECRET"].encode(), signing_input.encode(),
                               hashlib.sha256).digest()
          print(signing_input + "." + b64(signature))
          PY
          }

          # One request with a fresh token: code is the HTTP status (000 for
          # no answer), AMO's answer is in $body. The token stays in a file,
          # so it is in no command line.
          call() {
            local t
            t="$(token)"
            echo "::add-mask::$t"
            printf 'Authorization: JWT %s\n' "$t" > "$auth"
            code="$(curl -sS --connect-timeout 20 --max-time 240 -o "$body" -w '%{http_code}' \
              -H @"$auth" -H 'Accept: application/json' "$@")" || code="${code:-000}"
          }

          # A GET, asked again after a network error, 408, 429 or 5xx (up
          # to 5 times, 10 s apart); any other answer is the caller's.
          get() {
            for _ in 1 2 3 4 5; do
              call "$1"
              case "$code" in
                000|408|429|5??) echo "GET answered HTTP $code; asking again"; sleep 10 ;;
                *) return 0 ;;
              esac
            done
          }

          # AMO's error from the last answer: its code and detail, or each
          # field's messages, or the start of a non-JSON page.
          reason() {
            jq -r 'if type == "object" then
                if has("detail") then [.code, .detail] | map(select(. != null)) | map(tostring) | join(": ")
                else to_entries | map("\(.key): \(.value | if type == "array" then map(tostring) | join(" ") else tostring end)") | join("; ")
                end
              else tostring end' "$body" 2>/dev/null || head -c 500 "$body"
          }

          # The add-on: our credentials, and an add-on we may add versions to.
          get "$addon/"
          test "$code" = 200 \
            || { echo "::error::the add-on $ADDON_ID answered HTTP $code: $(reason) (it must exist on AMO, created by hand, with the key's account as an author)"; exit 1; }

          # The version number: AMO never takes one twice. If it is there, a
          # rerun after a submission that went through: nothing to upload.
          get "$addon/versions/v$VERSION/"
          case "$code" in
            200)
              status="$(jq -r '"\(.channel), file \(.file.status)"' "$body")"
              echo "::notice::$ADDON_ID $VERSION is already on AMO ($status); nothing uploaded."
              echo "$VERSION was already on AMO ($status); nothing uploaded" >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            404) ;;
            *) echo "::error::looking up $VERSION answered HTTP $code: $(reason)"; exit 1 ;;
          esac

          echo "uploading store.zip ($VERSION)"
          call -X POST "$AMO_API/addons/upload/" -F 'upload=@store.zip;type=application/zip' -F channel=listed
          test "$code" = 201 || { echo "::error::the upload answered HTTP $code, not 201: $(reason)"; exit 1; }
          uuid="$(jq -r '.uuid // empty' "$body")"
          test -n "$uuid" || { echo "::error::the upload's answer has no uuid"; exit 1; }

          # AMO's validator: processed within seconds to minutes; asked every
          # 10 s, at most 10 minutes. A network error, 408, 429 or 5xx is asked
          # again next round; any other HTTP error ends it at once.
          processed=false
          for _ in $(seq 1 60); do
            call "$AMO_API/addons/upload/$uuid/"
            case "$code" in
              200) processed="$(jq -r '.processed' "$body")"
                   [ "$processed" = true ] && break ;;
              000|408|429|5??) echo "the upload's status answered HTTP $code; asking again" ;;
              *) echo "::error::the upload's status answered HTTP $code: $(reason)"; exit 1 ;;
            esac
            sleep 10
          done
          test "$processed" = true || { echo "::error::the validation of upload $uuid did not end in 10 minutes"; exit 1; }
          jq -r '.validation // {} | "validation: \(.errors // 0) errors, \(.warnings // 0) warnings, \(.notices // 0) notices",
            ((.messages // [])[] | "  \(.type): \(.message)\(if .file then " (\(.file)\(if .line then ":\(.line)" else "" end))" else "" end)")' "$body"
          test "$(jq -r '.valid' "$body")" = true \
            || { echo "::error::AMO's validation failed (the errors above); nothing submitted"; exit 1; }

          # The version, from that upload, with the source and the notes for
          # review in one multipart request: a version is never there without
          # its source. Compatibility and licence: the manifest's and the
          # previous version's.
          notes="${NOTES:-Release $TAG of $GITHUB_REPOSITORY: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG}"
          form=(-F "upload=$uuid" --form-string "approval_notes=$notes")
          if [ -n "$SOURCE_ASSET" ]; then
            form+=(-F "source=@source/$SOURCE_ASSET")
          fi
          call -X POST "$addon/versions/" "${form[@]}"
          case "$code" in
            201) ;;
            409) echo "::error::AMO has $VERSION already (made since the check, or deleted before: a number is never taken twice): $(reason)"; exit 1 ;;
            *) echo "::error::creating the version answered HTTP $code, not 201: $(reason)"; exit 1 ;;
          esac
          jq '{id, version, channel, file: {status: .file.status}, source: (.source != null), edit_url}' "$body"
          status="$(jq -r '.file.status' "$body")"
          case "$status" in
            unreviewed|public) ;;
            *) echo "::error::$VERSION was created with file status '$status', not awaiting review"; exit 1 ;;
          esac
          with_source=""
          if [ -n "$SOURCE_ASSET" ]; then with_source=" with $SOURCE_ASSET"; fi
          echo "submitted $VERSION$with_source for review on AMO (file $status)" >> "$GITHUB_STEP_SUMMARY"
