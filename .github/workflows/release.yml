# Reusable release pipeline shared by ractive's Rust CLI repos (hyalo, hoppy,
# ff-rdp). Callers invoke this via `workflow_call` from their own
# `on: release: types: [published]` (or `workflow_dispatch` for dry runs)
# workflow and pass `secrets: inherit` so this workflow can read the caller's
# repository secrets directly.
#
# This workflow is fully self-contained: reusable workflows run their jobs
# against the CALLING repository's checkout, so any composite action or
# script path checked out from *this* repo would resolve against the wrong
# tree. Everything needed — including the crates.io publish retry loop that
# is intentionally duplicated from publish-crates.yml — lives inline here.
name: Release (reusable)

on:
  workflow_call:
    inputs:
      bin-name:
        description: "Binary name, e.g. hyalo"
        required: true
        type: string
      version-package:
        description: "Cargo package whose version must match the release tag, e.g. hyalo-cli"
        required: true
        type: string
      workspace-dir:
        description: "Path (relative to the caller repo root) to the Cargo workspace to build. Default is the repo root itself. Used by selftest.yml to point at testdata/fixture-cli."
        required: false
        type: string
        default: "."
      publish-crates:
        description: "Comma-separated, dependency-ordered list of crates to publish to crates.io. Empty skips crates.io."
        required: false
        type: string
        default: ""
      targets:
        description: "JSON array of {target, os, cross, run_tests} matrix entries"
        required: false
        type: string
        default: >-
          [
            {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-latest", "cross": false, "run_tests": true},
            {"target": "x86_64-unknown-linux-musl", "os": "ubuntu-latest", "cross": true, "run_tests": true},
            {"target": "aarch64-unknown-linux-gnu", "os": "ubuntu-latest", "cross": true, "run_tests": true},
            {"target": "aarch64-unknown-linux-musl", "os": "ubuntu-latest", "cross": true, "run_tests": true},
            {"target": "aarch64-apple-darwin", "os": "macos-latest", "cross": false, "run_tests": true},
            {"target": "x86_64-pc-windows-msvc", "os": "windows-latest", "cross": false, "run_tests": true},
            {"target": "aarch64-pc-windows-msvc", "os": "windows-latest", "cross": false, "run_tests": false}
          ]
      enable-sbom:
        description: "Generate a CycloneDX SBOM on native (non-cross) targets"
        required: false
        type: boolean
        default: true
      sbom-packages:
        description: "Comma-separated packages to attach SBOMs for. Empty falls back to version-package only. The version-package SBOM is named <archive>.cdx.json; extras are <archive>-<package>.cdx.json."
        required: false
        type: string
        default: ""
      enable-attestation:
        description: "Attest build provenance on native (non-cross) targets"
        required: false
        type: boolean
        default: true
      enable-linux-packages:
        description: "Build .deb and .rpm packages from a native x86_64-unknown-linux-gnu build"
        required: false
        type: boolean
        default: false
      linux-package-crate:
        description: "Crate to package for deb/rpm. Empty falls back to version-package."
        required: false
        type: string
        default: ""
      pre-package-command:
        description: "Bash command run after the build, before archiving/packaging (e.g. generate completions/man pages). Runs on every matrix target and in the linux-packages job. TARGET, CROSS, BIN_NAME, VERSION, BIN_PATH are exported; BIN_PATH is the built binary (relative to workspace-dir). When CROSS=true that binary is not host-runnable, so produce files with a host build (e.g. cargo run --bin) instead."
        required: false
        type: string
        default: ""
      extra-archive-paths:
        description: "Newline- or space-separated extra paths (relative to workspace-dir) to include in archives alongside the binary, LICENSE and README"
        required: false
        type: string
        default: ""
      winget-identifier:
        description: "e.g. ractive.hyalo. Empty skips winget."
        required: false
        type: string
        default: ""
      winget-pkgs-fork:
        description: "Owner/repo of the winget-pkgs fork to sync and submit from"
        required: false
        type: string
        default: "ractive/winget-pkgs"
      homebrew-tap:
        description: "Homebrew tap repository to publish the formula to"
        required: false
        type: string
        default: "ractive/homebrew-tap"
      homebrew-formula:
        description: "Formula file name (without .rb). Empty falls back to bin-name."
        required: false
        type: string
        default: ""
      homebrew-description:
        description: "Description for the Homebrew formula desc and Scoop manifest. Empty falls back to the version-package crate's Cargo.toml description, then '<bin-name> CLI'."
        required: false
        type: string
        default: ""
      homebrew-caveats:
        description: "Formula caveats text (rendered inside a `def caveats` block). Empty omits the caveats block entirely."
        required: false
        type: string
        default: ""
      scoop-bucket:
        description: "Scoop bucket repository to publish the manifest to"
        required: false
        type: string
        default: "ractive/scoop-bucket"
      aur-package:
        description: "AUR package name, e.g. hyalo-bin. Empty skips AUR."
        required: false
        type: string
        default: ""
      aur-maintainer:
        description: "Rendered as the '# Maintainer:' PKGBUILD comment."
        required: false
        type: string
        default: "Jean-Pierre Bergamin <james@ractive.ch>"
      cloudsmith-repo:
        description: "Cloudsmith org/repo slug, e.g. ractive/cli. Empty skips Cloudsmith."
        required: false
        type: string
        default: ""
      checksums-file:
        description: "Name of the checksums file the release (and the dry-run bundle) carries, and that the homebrew, scoop and aur jobs read. A repository that runs two callers against one release gives each its own name. Letters, digits, '.', '_' and '-' only."
        required: false
        type: string
        default: "SHA256SUMS"
      macos-sign-dry-run:
        description: "Sign and notarise the macOS binaries in a dry run too, when the Apple secrets exist. Off by default: a dry run builds an unreviewed ref, which should not get the signing key (docs/macos-signing.md)."
        required: false
        type: boolean
        default: false
      dry-run:
        description: "Build, test, package and upload as workflow artifacts only. Skips tag verification, GitHub release upload, crates.io, Homebrew, Scoop, winget and attestation."
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# No workflow-level permissions block: jobs that declare their own get least
# privilege, while `build` and `linux-packages` deliberately inherit the
# CALLER's grant. `build` conditionally needs id-token/attestations for
# provenance attestation, and a called workflow's job that explicitly
# requests more than the caller granted hard-fails even when the needing
# step is skipped — inheritance is the only shape that serves both real
# releases (full grant) and the dry-run selftest (contents: read).

jobs:
  # ---------------------------------------------------------------------
  # 1. Version check
  # ---------------------------------------------------------------------
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      description: ${{ steps.version.outputs.description }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Resolve and verify version
        id: version
        shell: bash
        working-directory: ${{ inputs.workspace-dir }}
        env:
          VERSION_PACKAGE: ${{ inputs.version-package }}
          DRY_RUN: ${{ inputs.dry-run }}
          TAG: ${{ github.event.release.tag_name }}
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        run: |
          set -euo pipefail
          # Used as a file name, a `gh release download --pattern` glob and a
          # URL path segment, so no glob, path or URL characters.
          if ! [[ "$CHECKSUMS_FILE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "ERROR: checksums-file '$CHECKSUMS_FILE' may only contain letters, digits, '.', '_' and '-'" >&2
            exit 1
          fi
          META=$(cargo metadata --no-deps --format-version 1)
          CARGO_VERSION=$(echo "$META" | jq -r --arg pkg "$VERSION_PACKAGE" '.packages[] | select(.name == $pkg) | .version')
          if [ -z "$CARGO_VERSION" ]; then
            echo "ERROR: package '$VERSION_PACKAGE' not found via cargo metadata" >&2
            exit 1
          fi
          # The crate's description doubles as the Homebrew formula desc and
          # Scoop manifest description (overridable via homebrew-description).
          CARGO_DESCRIPTION=$(echo "$META" | jq -r --arg pkg "$VERSION_PACKAGE" '.packages[] | select(.name == $pkg) | .description // ""')
          echo "description=$CARGO_DESCRIPTION" >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: skipping tag comparison, using Cargo.toml version $CARGO_VERSION"
            echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_VERSION="${TAG#v}"
          echo "Git tag version:    $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: tag '$TAG' does not match $VERSION_PACKAGE version '$CARGO_VERSION'" >&2
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # 2. Security
  # ---------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ inputs.workspace-dir }}

      - name: Install security tools
        uses: taiki-e/install-action@a1df9120380005ebdc788c62449b841b205541dd # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit dependencies for known vulnerabilities
        working-directory: ${{ inputs.workspace-dir }}
        run: cargo audit

      - name: Check licenses, advisories, bans, and sources
        working-directory: ${{ inputs.workspace-dir }}
        run: cargo deny check

  # ---------------------------------------------------------------------
  # 3. Build matrix
  # ---------------------------------------------------------------------
  build:
    needs: [version-check, security]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}

    runs-on: ${{ matrix.os }}

    # Optional Developer ID signing and notarisation of the macOS binary
    # (docs/macos-signing.md). `secrets` cannot appear in a step's `if:`,
    # so this flag carries "APPLE_CERTIFICATE is set" to the steps. Without
    # the secret it is 'false', every signing step skips, and the archive is
    # built exactly as before. A dry run builds whatever ref was dispatched,
    # whose build.rs and pre-package command nobody has reviewed yet, so it
    # gets the signing key only when the caller asks (macos-sign-dry-run).
    # The half-configured check sits in the import step, behind this flag.
    env:
      MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && (!inputs.dry-run || inputs.macos-sign-dry-run) }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Without a per-target key every matrix job shares one cache (same
          # github.job + same lockfile hash), and the cross-container builds
          # restore host-glibc build-script binaries from the native x86_64
          # job — which then fail inside the older-glibc cross image with
          # "version `GLIBC_2.28' not found".
          key: ${{ matrix.target }}
          workspaces: ${{ inputs.workspace-dir }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@a1df9120380005ebdc788c62449b841b205541dd # v2
        with:
          tool: cross

      - name: Set hermetic build provenance
        shell: bash
        # build.rs (if present) should prefer GIT_COMMIT/GIT_COMMIT_DATE over
        # shelling out to git, and declare them rerun-if-env-changed — that
        # forces the build script to rerun even when a restored rust-cache
        # carries a stale build-script output. Cross.toml must passthrough
        # both into cross containers for cross-compiled targets.
        run: |
          echo "GIT_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          echo "GIT_COMMIT_DATE=$(git show -s --date=short --format=%cd HEAD)" >> "$GITHUB_ENV"

      - name: Build release
        working-directory: ${{ inputs.workspace-dir }}
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Run tests
        if: matrix.run_tests
        working-directory: ${{ inputs.workspace-dir }}
        run: ${{ matrix.cross && 'cross' || 'cargo' }} test --workspace --target ${{ matrix.target }}

      - name: Verify CLI runs
        if: '!matrix.cross && matrix.run_tests'
        shell: bash
        working-directory: ${{ inputs.workspace-dir }}
        env:
          TARGET: ${{ matrix.target }}
          VERSION_PACKAGE: ${{ inputs.version-package }}
          BIN_NAME: ${{ inputs.bin-name }}
        # --bin disambiguates packages that ship more than one binary
        # (hoppy-cli has hoppy + fixture-refresh; bare -p is an error there).
        run: cargo run --release --target "$TARGET" -p "$VERSION_PACKAGE" --bin "$BIN_NAME" -- --help

      - name: Run pre-package command
        # Runs for cross targets too: their archives need the same extra
        # files (completions, man pages), which the command must then produce
        # with a host binary (e.g. `cargo run`) since the cross-compiled one
        # is not runnable here. CROSS tells the command which case it is in.
        if: inputs.pre-package-command != ''
        shell: bash
        working-directory: ${{ inputs.workspace-dir }}
        env:
          TARGET: ${{ matrix.target }}
          CROSS: ${{ matrix.cross }}
          BIN_NAME: ${{ inputs.bin-name }}
          VERSION: ${{ needs.version-check.outputs.version }}
          INPUTS_PRE_PACKAGE_COMMAND: ${{ inputs.pre-package-command }}
        # BIN_PATH points at the binary this job actually built (relative to
        # workspace-dir). On cross targets it exists but is not host-runnable.
        run: |
          BIN_PATH="target/${TARGET}/release/${BIN_NAME}"
          [ -f "${BIN_PATH}.exe" ] && BIN_PATH="${BIN_PATH}.exe"
          export BIN_PATH
          eval "$INPUTS_PRE_PACKAGE_COMMAND"

      # --- macOS signing (only with APPLE_CERTIFICATE; docs/macos-signing.md).
      # It runs after the pre-package command and before packaging, so the
      # archive, its SBOM and attestation, the checksums file and the Homebrew
      # checksum all describe the signed binary. Notarising does not change
      # the binary: a bare Mach-O cannot carry a stapled ticket, so
      # Gatekeeper looks the ticket up online on first launch.
      - name: Import the Developer ID certificate (macOS)
        if: env.MACOS_SIGNING == 'true' && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          # A half-configured repo fails here rather than shipping a signed
          # but unnotarised binary.
          for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "ERROR: APPLE_CERTIFICATE is set but $name is not (docs/macos-signing.md)" >&2
              exit 1
            fi
          done
          umask 077
          KEYCHAIN="${RUNNER_TEMP}/macos-signing.keychain-db"
          CERT="${RUNNER_TEMP}/macos-signing.p12"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # A .p12 from Keychain Access holds only the leaf and its key; the
          # "Developer ID - G2" intermediate that issued it may be missing on
          # the runner, and codesign then cannot build the chain. Pinned:
          # SHA-256 of https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          # (CN=Developer ID Certification Authority, OU=G2; expires 2031-09-17).
          G2_SHA256="f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"
          G2_CER="${RUNNER_TEMP}/DeveloperIDG2CA.cer"
          curl -fsSL --retry 3 -o "$G2_CER" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          if [ "$(shasum -a 256 "$G2_CER" | cut -d ' ' -f 1)" != "$G2_SHA256" ]; then
            echo "ERROR: DeveloperIDG2CA.cer does not match the pinned SHA-256; Apple may have reissued it, check and update G2_SHA256" >&2
            exit 1
          fi
          security import "$G2_CER" -k "$KEYCHAIN"
          rm -f "$G2_CER"
          security import "$CERT" -k "$KEYCHAIN" -f pkcs12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # On the search list so codesign finds the certificate chain.
          security list-keychains -d user -s "$KEYCHAIN" \
            "${HOME}/Library/Keychains/login.keychain-db"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" \
               | grep -qF -- "$APPLE_SIGNING_IDENTITY"; then
            echo "ERROR: APPLE_SIGNING_IDENTITY is not a valid signing identity in the imported certificate" >&2
            exit 1
          fi
          echo "MACOS_KEYCHAIN=${KEYCHAIN}" >> "$GITHUB_ENV"

      - name: Sign the binary (macOS)
        if: env.MACOS_SIGNING == 'true' && runner.os == 'macOS'
        shell: bash
        working-directory: ${{ inputs.workspace-dir }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ inputs.bin-name }}
          RUN_TESTS: ${{ matrix.run_tests }}
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/${BIN_NAME}"
          # Hardened runtime and a secure timestamp: both are required for
          # notarisation.
          codesign --force --options runtime --timestamp \
            --keychain "$MACOS_KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          DISPLAY_TXT="${RUNNER_TEMP}/codesign-display.txt"
          codesign --display --verbose=2 "$BIN" 2>&1 | tee "$DISPLAY_TXT"
          grep -q '(runtime)' "$DISPLAY_TXT"
          grep -q '^Timestamp=' "$DISPLAY_TXT"
          # The hardened runtime must not stop the binary from starting.
          if [ "$RUN_TESTS" = "true" ]; then
            "$BIN" --help > /dev/null
          fi

      - name: Notarise the binary (macOS)
        if: env.MACOS_SIGNING == 'true' && runner.os == 'macOS'
        shell: bash
        working-directory: ${{ inputs.workspace-dir }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ inputs.bin-name }}
        run: |
          set -euo pipefail
          umask 077
          BIN="target/${TARGET}/release/${BIN_NAME}"
          KEY="${RUNNER_TEMP}/macos-notary-key.p8"
          ZIP="${RUNNER_TEMP}/${BIN_NAME}-${TARGET}-notarise.zip"
          # APPLE_API_KEY is the base64 of the .p8 file; the raw PEM text
          # is accepted too.
          case "$APPLE_API_KEY" in
            -----BEGIN*) printf '%s\n' "$APPLE_API_KEY" > "$KEY" ;;
            *) printf '%s' "$APPLE_API_KEY" | base64 --decode > "$KEY" ;;
          esac
          # notarytool takes a zip, not a bare binary; the zip is only the
          # submission, the archive below still holds the binary itself.
          ditto -c -k --keepParent "$BIN" "$ZIP"
          notary() {
            xcrun notarytool "$@" --key "$KEY" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER"
          }
          RESULT=$(notary submit "$ZIP" --wait --timeout 30m --output-format json) || true
          rm -f "$ZIP"
          echo "$RESULT"
          STATUS=$(jq -r '.status // empty' <<< "$RESULT" 2> /dev/null || true)
          ID=$(jq -r '.id // empty' <<< "$RESULT" 2> /dev/null || true)
          MESSAGE=$(jq -r '.message // empty' <<< "$RESULT" 2> /dev/null || true)
          echo "Notarisation submission id: ${ID:-none}"
          # --wait gave up, Apple did not: a new team's first submissions can
          # take hours, later ones minutes.
          if [ -z "$STATUS" ] && [ -n "$ID" ] && [[ "$MESSAGE" == *Timeout* ]]; then
            echo "ERROR: Apple has not finished checking submission ${ID} after 30 min; it goes on at Apple. Check with \`xcrun notarytool info ${ID} --key AuthKey_<key id>.p8 --key-id <key id> --issuer <issuer id>\` and rerun the job when it is Accepted." >&2
            exit 1
          fi
          if [ "$STATUS" != "Accepted" ]; then
            echo "ERROR: notarisation ended with status '${STATUS:-none}'" >&2
            if [ -n "$ID" ]; then
              notary log "$ID" || true
            fi
            exit 1
          fi
          # Informational: asks Gatekeeper, online, for the ticket. Apple
          # documents spctl/syspolicy_check for bundles, so a bare binary's
          # verdict is logged, not enforced.
          spctl --assess --type open --context context:primary-signature -vv "$BIN" \
            || echo "::warning::spctl could not confirm the notarisation ticket yet"

      - name: Remove the signing keychain and key (macOS)
        if: always() && env.MACOS_SIGNING == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/macos-signing.keychain-db" 2> /dev/null || true
          rm -f "${RUNNER_TEMP}/macos-signing.p12" "${RUNNER_TEMP}/macos-notary-key.p8"

      - name: Determine archive name
        shell: bash
        env:
          BIN_NAME: ${{ inputs.bin-name }}
          VERSION: ${{ needs.version-check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          echo "ARCHIVE_BASE=${BIN_NAME}-v${VERSION}-${TARGET}" >> "$GITHUB_ENV"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          BIN_NAME: ${{ inputs.bin-name }}
          EXTRA_ARCHIVE_PATHS: ${{ inputs.extra-archive-paths }}
          WORKSPACE_DIR: ${{ inputs.workspace-dir }}
        run: |
          set -euo pipefail
          mkdir -p archive
          cp "${WORKSPACE_DIR}/target/${{ matrix.target }}/release/${BIN_NAME}" archive/
          [ -f "${WORKSPACE_DIR}/LICENSE" ] && cp "${WORKSPACE_DIR}/LICENSE" archive/
          [ -f "${WORKSPACE_DIR}/README.md" ] && cp "${WORKSPACE_DIR}/README.md" archive/
          if [ -n "${EXTRA_ARCHIVE_PATHS}" ]; then
            for p in ${EXTRA_ARCHIVE_PATHS}; do
              mkdir -p "archive/$(dirname "$p")"
              cp -r "${WORKSPACE_DIR}/$p" "archive/$p"
            done
          fi
          tar czf "${ARCHIVE_BASE}.tar.gz" -C archive .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          BIN_NAME: ${{ inputs.bin-name }}
          EXTRA_ARCHIVE_PATHS: ${{ inputs.extra-archive-paths }}
          WORKSPACE_DIR: ${{ inputs.workspace-dir }}
        run: |
          set -euo pipefail
          mkdir -p archive
          cp "${WORKSPACE_DIR}/target/${{ matrix.target }}/release/${BIN_NAME}.exe" archive/
          [ -f "${WORKSPACE_DIR}/LICENSE" ] && cp "${WORKSPACE_DIR}/LICENSE" archive/
          [ -f "${WORKSPACE_DIR}/README.md" ] && cp "${WORKSPACE_DIR}/README.md" archive/
          if [ -n "${EXTRA_ARCHIVE_PATHS}" ]; then
            for p in ${EXTRA_ARCHIVE_PATHS}; do
              mkdir -p "archive/$(dirname "$p")"
              cp -r "${WORKSPACE_DIR}/$p" "archive/$p"
            done
          fi
          cd archive
          7z a "../${ARCHIVE_BASE}.zip" .

      - name: Install cargo-cyclonedx
        if: inputs.enable-sbom && !matrix.cross
        uses: taiki-e/install-action@a1df9120380005ebdc788c62449b841b205541dd # v2
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        if: inputs.enable-sbom && !matrix.cross
        shell: bash
        working-directory: ${{ inputs.workspace-dir }}
        env:
          BIN_VERSION_PACKAGE: ${{ inputs.version-package }}
          SBOM_PACKAGES: ${{ inputs.sbom-packages }}
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --target ${{ matrix.target }}
          # cargo-cyclonedx writes one SBOM per package next to its
          # Cargo.toml. A package's directory need not carry its name
          # (crates/foo-cli holding the package `foo`), so each requested
          # package is looked up by name in cargo metadata and its SBOM taken
          # from its manifest's directory. A requested SBOM that is missing
          # fails the job: SBOMs are on, so a release without one is a broken
          # release, not a warning.
          META=$(cargo metadata --no-deps --format-version 1)
          IFS=',' read -ra pkgs <<< "${SBOM_PACKAGES:-$BIN_VERSION_PACKAGE}"
          for pkg in "${pkgs[@]}"; do
            pkg="$(echo "$pkg" | xargs)"
            [ -z "$pkg" ] && continue
            if ! jq -e --arg p "$pkg" '.packages[] | select(.name == $p)' <<< "$META" > /dev/null; then
              echo "ERROR: SBOM requested for '$pkg', which is not a package of this workspace" >&2
              exit 1
            fi
            # The manifest's own directory, absolute: the step runs in
            # workspace-dir, which need not be cargo's workspace root.
            # jq.exe on Windows ends its lines with CRLF, and $(...) strips
            # only the LF; cygpath turns D:\a\... into a path bash globs.
            manifest=$(jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .manifest_path' <<< "$META" | tr -d '\r')
            if [ "${RUNNER_OS:-}" = "Windows" ]; then
              manifest=$(cygpath -u "$manifest")
            fi
            dir=$(dirname "$manifest")
            src=""
            n=0
            for f in "$dir"/*.cdx.json; do
              [ -e "$f" ] || continue
              src="$f"
              n=$((n + 1))
            done
            if [ "$n" -ne 1 ]; then
              echo "ERROR: expected one SBOM for package '$pkg' in '$dir', found $n" >&2
              ls -la "$dir" >&2
              exit 1
            fi
            # The version-package SBOM keeps the bare archive name for
            # backward compatibility; extras are suffixed with the package.
            if [ "$pkg" = "$BIN_VERSION_PACKAGE" ]; then
              dest="${ARCHIVE_BASE}.cdx.json"
            else
              dest="${ARCHIVE_BASE}-${pkg}.cdx.json"
            fi
            echo "SBOM of $pkg: $src -> $dest"
            # GITHUB_WORKSPACE is the job's absolute checkout root — using
            # it (rather than a relative "..") keeps this correct
            # regardless of how deep workspace-dir is nested.
            cp "$src" "${GITHUB_WORKSPACE}/${dest}"
          done

      - name: Attest build provenance
        if: inputs.enable-attestation && !matrix.cross && !inputs.dry-run
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          # A single prefix glob: only one of .tar.gz/.zip exists per
          # platform, the action errors on literal paths that match nothing,
          # and extra SBOMs are named <archive>-<package>.cdx.json.
          subject-path: ${{ env.ARCHIVE_BASE }}*

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.bin-name }}-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_BASE }}.tar.gz
            ${{ env.ARCHIVE_BASE }}.zip
            ${{ env.ARCHIVE_BASE }}.cdx.json
            ${{ env.ARCHIVE_BASE }}-*.cdx.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # 4. Linux packages (deb/rpm) — conditional
  # ---------------------------------------------------------------------
  linux-packages:
    needs: [version-check, security]
    if: inputs.enable-linux-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: linux-packages
          workspaces: ${{ inputs.workspace-dir }}

      - name: Build release binary
        working-directory: ${{ inputs.workspace-dir }}
        run: cargo build --release --locked

      - name: Run pre-package command
        if: inputs.pre-package-command != ''
        shell: bash
        working-directory: ${{ inputs.workspace-dir }}
        env:
          TARGET: x86_64-unknown-linux-gnu
          CROSS: "false"
          BIN_NAME: ${{ inputs.bin-name }}
          VERSION: ${{ needs.version-check.outputs.version }}
          INPUTS_PRE_PACKAGE_COMMAND: ${{ inputs.pre-package-command }}
        # This job builds without --target, so the binary lands in
        # target/release/ — BIN_PATH abstracts that difference for callers.
        run: |
          BIN_PATH="target/release/${BIN_NAME}"
          export BIN_PATH
          eval "$INPUTS_PRE_PACKAGE_COMMAND"

      - name: Resolve package crate directory
        id: pkgdir
        shell: bash
        working-directory: ${{ inputs.workspace-dir }}
        env:
          LINUX_PACKAGE_CRATE: ${{ inputs.linux-package-crate }}
          VERSION_PACKAGE: ${{ inputs.version-package }}
        run: |
          set -euo pipefail
          crate="${LINUX_PACKAGE_CRATE:-$VERSION_PACKAGE}"
          dir=$(cargo metadata --no-deps --format-version 1 | jq -r --arg pkg "$crate" '.packages[] | select(.name == $pkg) | .manifest_path' | xargs dirname)
          if [ -z "$dir" ] || [ "$dir" = "." ]; then
            echo "ERROR: could not resolve manifest directory for crate '$crate'" >&2
            exit 1
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        uses: taiki-e/install-action@a1df9120380005ebdc788c62449b841b205541dd # v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build deb package
        # cargo-deb picks up the binary from target/release/ and assets from
        # [package.metadata.deb] in the package's own Cargo.toml, resolved
        # relative to that package directory.
        working-directory: ${{ inputs.workspace-dir }}
        run: cargo deb -p "${STEPS_PKGDIR_OUTPUTS_CRATE}" --no-build --no-strip
        env:
          STEPS_PKGDIR_OUTPUTS_CRATE: ${{ steps.pkgdir.outputs.crate }}

      - name: Build rpm package
        # cargo-generate-rpm's `-p` is a path (NOT a workspace package name
        # like cargo's own -p flag), resolved relative to this step's cwd. It
        # reads [package.metadata.generate-rpm] from that Cargo.toml.
        working-directory: ${{ inputs.workspace-dir }}
        run: cargo generate-rpm -p "${STEPS_PKGDIR_OUTPUTS_DIR}"
        env:
          STEPS_PKGDIR_OUTPUTS_DIR: ${{ steps.pkgdir.outputs.dir }}

      - name: Rename packages with version
        shell: bash
        env:
          BIN_NAME: ${{ inputs.bin-name }}
          VERSION: ${{ needs.version-check.outputs.version }}
          WORKSPACE_DIR: ${{ inputs.workspace-dir }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for f in "${WORKSPACE_DIR}"/target/debian/*.deb; do
            cp "$f" "dist/${BIN_NAME}-v${VERSION}-x86_64-linux.deb"
          done
          for f in "${WORKSPACE_DIR}"/target/generate-rpm/*.rpm; do
            cp "$f" "dist/${BIN_NAME}-v${VERSION}-x86_64-linux.rpm"
          done

      - name: Upload deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.bin-name }}-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload rpm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.bin-name }}-rpm
          path: dist/*.rpm
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 5. GitHub release upload (skipped in dry-run)
  # ---------------------------------------------------------------------
  release:
    needs: [version-check, build, linux-packages]
    if: |
      !cancelled() && !inputs.dry-run &&
      needs.build.result == 'success' &&
      (needs.linux-packages.result == 'success' || needs.linux-packages.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Only this caller's artifacts: a repository that runs two callers in
      # one workflow run has the other's in the same run. The pattern
      # narrows the download; the file filter drops what a longer bin-name
      # with this one as its prefix uploaded (bin-name `foo` also matches
      # the artifacts of `foo-bar`). Every file this workflow uploads starts
      # with `<bin-name>-v<version>-`.
      - name: Download this caller's artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: ${{ inputs.bin-name }}-*
          merge-multiple: true

      - name: Keep only this caller's files
        shell: bash
        env:
          BIN_NAME: ${{ inputs.bin-name }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts
          for f in *; do
            case "$f" in
              "${BIN_NAME}-v${VERSION}-"*) ;;
              *) echo "Not this caller's, dropped: $f"; rm -rf -- "$f" ;;
            esac
          done
          if ! compgen -G "${BIN_NAME}-v${VERSION}-*" > /dev/null; then
            echo "ERROR: no artifacts of ${BIN_NAME} ${VERSION}" >&2
            exit 1
          fi

      - name: Generate the checksums file
        env:
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        run: |
          cd artifacts
          sha256sum -- * > "${CHECKSUMS_FILE}"
          cat "${CHECKSUMS_FILE}"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "${GITHUB_EVENT_RELEASE_TAG_NAME}" artifacts/*

  # ---------------------------------------------------------------------
  # 6. Dry-run summary (only in dry-run)
  # ---------------------------------------------------------------------
  dry-run-summary:
    needs: [version-check, build, linux-packages]
    if: |
      !cancelled() && inputs.dry-run &&
      needs.build.result == 'success' &&
      (needs.linux-packages.result == 'success' || needs.linux-packages.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Only this caller's artifacts: a repository that runs two callers in
      # one workflow run has the other's in the same run. The pattern
      # narrows the download; the file filter drops what a longer bin-name
      # with this one as its prefix uploaded (bin-name `foo` also matches
      # the artifacts of `foo-bar`). Every file this workflow uploads starts
      # with `<bin-name>-v<version>-`.
      - name: Download this caller's artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: ${{ inputs.bin-name }}-*
          merge-multiple: true

      - name: Keep only this caller's files
        shell: bash
        env:
          BIN_NAME: ${{ inputs.bin-name }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts
          for f in *; do
            case "$f" in
              "${BIN_NAME}-v${VERSION}-"*) ;;
              *) echo "Not this caller's, dropped: $f"; rm -rf -- "$f" ;;
            esac
          done
          if ! compgen -G "${BIN_NAME}-v${VERSION}-*" > /dev/null; then
            echo "ERROR: no artifacts of ${BIN_NAME} ${VERSION}" >&2
            exit 1
          fi

      - name: Generate the checksums file
        env:
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        run: |
          cd artifacts
          sha256sum -- * > "${CHECKSUMS_FILE}"
          cat "${CHECKSUMS_FILE}"

      # Named after bin-name so two callers' bundles do not collide, with
      # the bin-name last so that a caller's own `<bin-name>-*` download of
      # the run's artifacts does not take the bundle in too.
      - name: Upload dry-run bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dry-run-bundle-${{ inputs.bin-name }}
          path: artifacts/*

      - name: Print summary
        shell: bash
        env:
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        run: |
          {
            echo "## Dry-run release bundle"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            cd artifacts
            for f in *; do
              [ "$f" = "$CHECKSUMS_FILE" ] && continue
              size=$(du -h "$f" | cut -f1)
              echo "| $f | $size |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # 7. crates.io (conditional, skipped in dry-run)
  # ---------------------------------------------------------------------
  # Every post-release job guards with `!cancelled() && needs.release.result
  # == 'success'`: `release` needs `linux-packages`, which is skipped when
  # deb/rpm are off, and a skipped ancestor would otherwise skip these jobs
  # too, although `release` itself ran. `!cancelled()`, not `always()`, so
  # cancelling the run still stops the publishing.
  crates-io:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && inputs.publish-crates != '' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ inputs.workspace-dir }}

      - name: Verify CARGO_TOKEN is set
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CARGO_TOKEN}" ]; then
            echo "ERROR: CARGO_TOKEN secret is not set. Add a crates.io API token as a repository secret." >&2
            exit 1
          fi

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
          PUBLISH_CRATES: ${{ inputs.publish-crates }}
        shell: bash
        working-directory: ${{ inputs.workspace-dir }}
        # Duplicated from publish-crates.yml by design — see the file header
        # in this workflow for why reusable workflows can't share scripts.
        run: |
          set -euo pipefail
          IFS=',' read -ra crates <<< "${PUBLISH_CRATES}"
          for crate in "${crates[@]}"; do
            crate="$(echo "$crate" | xargs)"
            [ -z "$crate" ] && continue
            echo "::group::Publishing $crate"
            max_attempts=10
            delay=15
            # crates.io answers 429 "You have published too many new crates
            # in a short period of time" when an account creates crates
            # faster than it allows, and lets one more through about every
            # 10 minutes. Those waits do not count as attempts.
            rate_waits=0
            max_rate_waits=6
            published=false
            attempt=0
            while [ "$attempt" -lt "$max_attempts" ]; do
              attempt=$((attempt + 1))
              echo "Publishing $crate (attempt $attempt/$max_attempts)..."
              if output=$(cargo publish --package "$crate" --locked 2>&1); then
                echo "$output"
                echo "$crate published successfully."
                published=true
                break
              fi
              echo "$output"
              if echo "$output" | grep -qE 'already (uploaded|exists)'; then
                echo "$crate already published, skipping."
                published=true
                break
              fi
              # Only the new-crates limit clears by waiting. Any other 429
              # (too many versions of one crate a day, too many updates)
              # falls through to the non-index error below and fails now.
              if echo "$output" | grep -qF 'published too many new crates'; then
                if [ "$rate_waits" -ge "$max_rate_waits" ]; then
                  echo "ERROR: crates.io still rate-limits $crate after $max_rate_waits waits of 600s" >&2
                  exit 1
                fi
                rate_waits=$((rate_waits + 1))
                attempt=$((attempt - 1))
                echo "crates.io rate limit (429), waiting 600s ($rate_waits/$max_rate_waits)..."
                sleep 600
                continue
              fi
              if echo "$output" | grep -qiE 'failed to select a version|no matching package named|depends on'; then
                if [ "$attempt" -eq "$max_attempts" ]; then
                  echo "ERROR: giving up on $crate after $max_attempts attempts" >&2
                  exit 1
                fi
                echo "Index not yet updated, waiting ${delay}s..."
                sleep "$delay"
                delay=$((delay * 2))
              else
                echo "ERROR: cargo publish failed for $crate with a non-index error" >&2
                exit 1
              fi
            done
            echo "::endgroup::"
            if [ "$published" != true ]; then
              echo "ERROR: $crate was not published" >&2
              exit 1
            fi
          done

  # ---------------------------------------------------------------------
  # 8. Homebrew (skipped in dry-run)
  # ---------------------------------------------------------------------
  homebrew:
    needs: [release, version-check]
    if: ${{ !cancelled() && needs.release.result == 'success' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download the checksums file from release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        run: |
          gh release download "${GITHUB_EVENT_RELEASE_TAG_NAME}" \
            --pattern "${CHECKSUMS_FILE}" --dir .

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          BIN_NAME: ${{ inputs.bin-name }}
          FORMULA_NAME: ${{ inputs.homebrew-formula }}
          FORMULA_DESCRIPTION: ${{ inputs.homebrew-description }}
          CARGO_DESCRIPTION: ${{ needs.version-check.outputs.description }}
          FORMULA_CAVEATS: ${{ inputs.homebrew-caveats }}
          HOMEBREW_TAP: ${{ inputs.homebrew-tap }}
          VERSION: ${{ needs.version-check.outputs.version }}
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        run: |
          set -euo pipefail

          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "ERROR: HOMEBREW_TAP_TOKEN secret is not set" >&2
            exit 1
          fi

          FORMULA_NAME="${FORMULA_NAME:-$BIN_NAME}"
          # Precedence: explicit input > crate description > generic fallback
          FORMULA_DESCRIPTION="${FORMULA_DESCRIPTION:-${CARGO_DESCRIPTION:-${BIN_NAME} CLI}}"
          REPO="${GITHUB_REPOSITORY}"
          RELEASE_URL="https://github.com/${REPO}/releases/download"

          get_sha() {
            awk -v file="$1" '$2 == file {print $1}' "$CHECKSUMS_FILE"
          }

          # Prefer musl artifacts for Linux where available (statically
          # linked, no glibc version coupling); fall back to gnu.
          find_linux_artifact() {
            local arch="$1"
            local musl_name="${BIN_NAME}-v${VERSION}-${arch}-unknown-linux-musl.tar.gz"
            local gnu_name="${BIN_NAME}-v${VERSION}-${arch}-unknown-linux-gnu.tar.gz"
            if grep -q " $musl_name\$" "$CHECKSUMS_FILE"; then
              echo "$musl_name"
            elif grep -q " $gnu_name\$" "$CHECKSUMS_FILE"; then
              echo "$gnu_name"
            else
              echo ""
            fi
          }

          MACOS_ARM64_FILE="${BIN_NAME}-v${VERSION}-aarch64-apple-darwin.tar.gz"
          LINUX_ARM64_FILE=$(find_linux_artifact aarch64)
          LINUX_X86_FILE=$(find_linux_artifact x86_64)

          SHA_MACOS_ARM64=""
          SHA_LINUX_ARM64=""
          SHA_LINUX_X86=""
          if grep -q " ${MACOS_ARM64_FILE}\$" "$CHECKSUMS_FILE"; then
            SHA_MACOS_ARM64=$(get_sha "$MACOS_ARM64_FILE")
          fi
          [ -n "$LINUX_ARM64_FILE" ] && SHA_LINUX_ARM64=$(get_sha "$LINUX_ARM64_FILE")
          [ -n "$LINUX_X86_FILE" ] && SHA_LINUX_X86=$(get_sha "$LINUX_X86_FILE")

          if [ -z "$SHA_MACOS_ARM64" ] && [ -z "$SHA_LINUX_ARM64" ] && [ -z "$SHA_LINUX_X86" ]; then
            echo "ERROR: no known platform artifacts found in ${CHECKSUMS_FILE} for Homebrew formula" >&2
            exit 1
          fi

          {
            echo "# typed: false"
            echo "# frozen_string_literal: true"
            echo "#"
            echo "# Homebrew formula for ${BIN_NAME}."
            echo "# Auto-updated by the release workflow in ${REPO}."
            echo "class $(echo "$FORMULA_NAME" | sed -E 's/(^|-)([a-z])/\U\2/g') < Formula"
            echo "  desc \"${FORMULA_DESCRIPTION}\""
            echo "  homepage \"https://github.com/${REPO}\""
            echo "  version \"${VERSION}\""
            echo "  license \"MIT\""
            echo ""
            if [ -n "$SHA_MACOS_ARM64" ]; then
              echo "  on_macos do"
              echo "    on_arm do"
              echo "      url \"${RELEASE_URL}/v#{version}/${MACOS_ARM64_FILE}\""
              echo "      sha256 \"${SHA_MACOS_ARM64}\""
              echo "    end"
              echo "  end"
              echo ""
            fi
            if [ -n "$SHA_LINUX_ARM64" ] || [ -n "$SHA_LINUX_X86" ]; then
              echo "  on_linux do"
              if [ -n "$SHA_LINUX_ARM64" ]; then
                echo "    on_arm do"
                echo "      url \"${RELEASE_URL}/v#{version}/${LINUX_ARM64_FILE}\""
                echo "      sha256 \"${SHA_LINUX_ARM64}\""
                echo "    end"
                echo ""
              fi
              if [ -n "$SHA_LINUX_X86" ]; then
                echo "    on_intel do"
                echo "      url \"${RELEASE_URL}/v#{version}/${LINUX_X86_FILE}\""
                echo "      sha256 \"${SHA_LINUX_X86}\""
                echo "    end"
              fi
              echo "  end"
              echo ""
            fi
            echo "  def install"
            echo "    bin.install \"${BIN_NAME}\""
            echo "  end"
            echo ""
            if [ -n "$FORMULA_CAVEATS" ]; then
              echo "  def caveats"
              echo "    <<~EOS"
              while IFS= read -r line; do
                echo "      ${line}"
              done <<< "$FORMULA_CAVEATS"
              echo "    EOS"
              echo "  end"
              echo ""
            fi
            echo "  test do"
            echo "    assert_match version.to_s, shell_output(\"#{bin}/${BIN_NAME} --version\")"
            echo "  end"
            echo "end"
          } > formula.rb

          cat formula.rb

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP}.git" tap
          cp formula.rb "tap/Formula/${FORMULA_NAME}.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA_NAME}.rb"
          if git diff --cached --quiet; then
            echo "Formula unchanged, skipping commit"
          else
            git commit -m "Update ${FORMULA_NAME} to ${VERSION}"
            # Two callers in one run (or two releases at once) push to the
            # same tap: a rejected push rebases onto the other's commit
            # (another file) and tries again, 5 pushes in all.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "ERROR: push to ${HOMEBREW_TAP} failed 5 times" >&2
                exit 1
              fi
              sleep $((attempt * 5))
              # A failed fetch or a conflict is one more failed attempt,
              # not the end of the job (set -e).
              if ! git pull --rebase; then
                git rebase --abort 2> /dev/null || true
                echo "git pull --rebase failed (attempt $attempt/5)"
              fi
            done
          fi

  # ---------------------------------------------------------------------
  # 9. Scoop (skipped in dry-run)
  # ---------------------------------------------------------------------
  scoop:
    needs: [release, version-check]
    if: ${{ !cancelled() && needs.release.result == 'success' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download the checksums file from release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        run: |
          gh release download "${GITHUB_EVENT_RELEASE_TAG_NAME}" \
            --pattern "${CHECKSUMS_FILE}" --dir .

      - name: Update Scoop manifest
        shell: bash
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          BIN_NAME: ${{ inputs.bin-name }}
          SCOOP_BUCKET: ${{ inputs.scoop-bucket }}
          VERSION: ${{ needs.version-check.outputs.version }}
          OVERRIDE_DESCRIPTION: ${{ inputs.homebrew-description }}
          CARGO_DESCRIPTION: ${{ needs.version-check.outputs.description }}
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        run: |
          set -euo pipefail

          if [ -z "${SCOOP_BUCKET_TOKEN}" ]; then
            echo "ERROR: SCOOP_BUCKET_TOKEN secret is not set" >&2
            exit 1
          fi

          REPO="${GITHUB_REPOSITORY}"
          # Same precedence as the Homebrew formula desc.
          DESCRIPTION="${OVERRIDE_DESCRIPTION:-${CARGO_DESCRIPTION:-${BIN_NAME} CLI}}"

          get_sha() {
            awk -v file="$1" '$2 == file {print $1}' "$CHECKSUMS_FILE"
          }

          WIN_X64_FILE="${BIN_NAME}-v${VERSION}-x86_64-pc-windows-msvc.zip"
          WIN_ARM64_FILE="${BIN_NAME}-v${VERSION}-aarch64-pc-windows-msvc.zip"

          SHA_WIN_X64=""
          SHA_WIN_ARM64=""
          grep -q " ${WIN_X64_FILE}\$" "$CHECKSUMS_FILE" && SHA_WIN_X64=$(get_sha "$WIN_X64_FILE")
          grep -q " ${WIN_ARM64_FILE}\$" "$CHECKSUMS_FILE" && SHA_WIN_ARM64=$(get_sha "$WIN_ARM64_FILE")

          if [ -z "$SHA_WIN_X64" ] && [ -z "$SHA_WIN_ARM64" ]; then
            echo "ERROR: no Windows artifacts found in ${CHECKSUMS_FILE} for Scoop manifest" >&2
            exit 1
          fi

          RELEASE_URL="https://github.com/${REPO}/releases/download"

          jq -n \
            --arg version "$VERSION" \
            --arg bin_name "$BIN_NAME" \
            --arg description "$DESCRIPTION" \
            --arg repo "$REPO" \
            --arg release_url "$RELEASE_URL" \
            --arg win_x64_file "$WIN_X64_FILE" \
            --arg win_arm64_file "$WIN_ARM64_FILE" \
            --arg sha_x64 "$SHA_WIN_X64" \
            --arg sha_arm64 "$SHA_WIN_ARM64" \
            --arg checksums_file "$CHECKSUMS_FILE" \
            '
            def arch_entry(file; sha):
              if (sha | length) > 0 then
                {
                  url: "\($release_url)/v\($version)/\(file)",
                  hash: sha
                }
              else empty end;
            {
              version: $version,
              description: $description,
              homepage: "https://github.com/\($repo)",
              license: "MIT",
              architecture: (
                {}
                + (if ($sha_x64 | length) > 0 then {"64bit": arch_entry($win_x64_file; $sha_x64)} else {} end)
                + (if ($sha_arm64 | length) > 0 then {"arm64": arch_entry($win_arm64_file; $sha_arm64)} else {} end)
              ),
              bin: "\($bin_name).exe",
              checkver: "github",
              autoupdate: {
                architecture: (
                  {}
                  + (if ($sha_x64 | length) > 0 then {
                      "64bit": {
                        url: "\($release_url)/v$version/\($bin_name)-v$version-x86_64-pc-windows-msvc.zip",
                        hash: {
                          url: "\($release_url)/v$version/\($checksums_file)",
                          regex: "([a-fA-F0-9]+)\\s+\($bin_name)-v$version-x86_64-pc-windows-msvc\\.zip"
                        }
                      }
                    } else {} end)
                  + (if ($sha_arm64 | length) > 0 then {
                      arm64: {
                        url: "\($release_url)/v$version/\($bin_name)-v$version-aarch64-pc-windows-msvc.zip",
                        hash: {
                          url: "\($release_url)/v$version/\($checksums_file)",
                          regex: "([a-fA-F0-9]+)\\s+\($bin_name)-v$version-aarch64-pc-windows-msvc\\.zip"
                        }
                      }
                    } else {} end)
                )
              }
            }' > "${BIN_NAME}.json"

          cat "${BIN_NAME}.json"

          git clone "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/${SCOOP_BUCKET}.git" scoop-repo
          cp "${BIN_NAME}.json" "scoop-repo/bucket/${BIN_NAME}.json"
          cd scoop-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "bucket/${BIN_NAME}.json"
          if git diff --cached --quiet; then
            echo "Manifest unchanged, skipping commit"
          else
            git commit -m "Update ${BIN_NAME} to ${VERSION}"
            # As in the homebrew job: rebase onto a concurrent push and try
            # again, 5 pushes in all.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "ERROR: push to ${SCOOP_BUCKET} failed 5 times" >&2
                exit 1
              fi
              sleep $((attempt * 5))
              # A failed fetch or a conflict is one more failed attempt,
              # not the end of the job (set -e).
              if ! git pull --rebase; then
                git rebase --abort 2> /dev/null || true
                echo "git pull --rebase failed (attempt $attempt/5)"
              fi
            done
          fi

  # ---------------------------------------------------------------------
  # 10. winget (conditional, skipped in dry-run, non-blocking)
  # ---------------------------------------------------------------------
  winget:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && inputs.winget-identifier != '' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # winget-releaser can only update existing packages — the first version
    # must be submitted manually via PR to microsoft/winget-pkgs. Non-blocking
    # so a winget hiccup never fails the release.
    continue-on-error: true
    steps:
      - name: Verify WINGET_TOKEN is set
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WINGET_TOKEN}" ]; then
            echo "ERROR: WINGET_TOKEN secret is not set" >&2
            exit 1
          fi

      - name: Sync winget-pkgs fork
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          INPUTS_WINGET_PKGS_FORK: ${{ inputs.winget-pkgs-fork }}
        run: gh repo sync "${INPUTS_WINGET_PKGS_FORK}"

      - name: Submit to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: ${{ inputs.winget-identifier }}
          installers-regex: '${{ inputs.bin-name }}-.*-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  # ---------------------------------------------------------------------
  # 11. AUR (conditional, skipped in dry-run, non-blocking)
  # ---------------------------------------------------------------------
  aur:
    needs: [release, version-check]
    if: ${{ !cancelled() && needs.release.result == 'success' && inputs.aur-package != '' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A bad AUR push (e.g. a malformed PKGBUILD) shouldn't fail the whole
    # release — same non-blocking stance as winget.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify AUR_SSH_PRIVATE_KEY is set
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "ERROR: AUR_SSH_PRIVATE_KEY secret is not set" >&2
            exit 1
          fi

      - name: Download the checksums file from release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        run: |
          gh release download "${GITHUB_EVENT_RELEASE_TAG_NAME}" \
            --pattern "${CHECKSUMS_FILE}" --dir .

      - name: Generate PKGBUILD
        env:
          BIN_NAME: ${{ inputs.bin-name }}
          AUR_PACKAGE: ${{ inputs.aur-package }}
          AUR_MAINTAINER: ${{ inputs.aur-maintainer }}
          FORMULA_DESCRIPTION: ${{ inputs.homebrew-description }}
          CARGO_DESCRIPTION: ${{ needs.version-check.outputs.description }}
          VERSION: ${{ needs.version-check.outputs.version }}
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        run: |
          set -euo pipefail

          # Same precedence as the Homebrew formula desc / Scoop description.
          PKGDESC="${FORMULA_DESCRIPTION:-${CARGO_DESCRIPTION:-${BIN_NAME} CLI}}"
          REPO="${GITHUB_REPOSITORY}"
          RELEASE_URL="https://github.com/${REPO}/releases/download"

          get_sha() {
            awk -v file="$1" '$2 == file {print $1}' "$CHECKSUMS_FILE"
          }

          # Same musl-first-else-gnu preference as the Homebrew job, applied
          # to both arches (AUR has no separate "Intel vs ARM" split like
          # Homebrew's on_intel/on_arm — both go in one PKGBUILD).
          find_linux_artifact() {
            local arch="$1"
            local musl_name="${BIN_NAME}-v${VERSION}-${arch}-unknown-linux-musl.tar.gz"
            local gnu_name="${BIN_NAME}-v${VERSION}-${arch}-unknown-linux-gnu.tar.gz"
            if grep -q " $musl_name\$" "$CHECKSUMS_FILE"; then
              echo "$musl_name"
            elif grep -q " $gnu_name\$" "$CHECKSUMS_FILE"; then
              echo "$gnu_name"
            else
              echo ""
            fi
          }

          X86_FILE=$(find_linux_artifact x86_64)
          ARM64_FILE=$(find_linux_artifact aarch64)

          SHA_X86=""
          SHA_ARM64=""
          [ -n "$X86_FILE" ] && SHA_X86=$(get_sha "$X86_FILE")
          [ -n "$ARM64_FILE" ] && SHA_ARM64=$(get_sha "$ARM64_FILE")

          if [ -z "$SHA_X86" ] && [ -z "$SHA_ARM64" ]; then
            echo "ERROR: no Linux artifacts found in ${CHECKSUMS_FILE} for PKGBUILD" >&2
            exit 1
          fi

          ARCHES=()
          [ -n "$SHA_X86" ] && ARCHES+=("x86_64")
          [ -n "$SHA_ARM64" ] && ARCHES+=("aarch64")
          ARCH_LIST=()
          for a in "${ARCHES[@]}"; do
            ARCH_LIST+=("'$a'")
          done

          {
            echo "# Maintainer: ${AUR_MAINTAINER}"
            echo "# Auto-updated by the release workflow in ${REPO}."
            echo "pkgname=${AUR_PACKAGE}"
            echo "_bin=${BIN_NAME}"
            echo "pkgver=${VERSION}"
            echo "pkgrel=1"
            echo "pkgdesc=\"${PKGDESC}\""
            IFS=" "
            echo "arch=(${ARCH_LIST[*]})"
            unset IFS
            echo "url=\"https://github.com/${REPO}\""
            echo "license=('MIT')"
            echo "provides=(\"\$_bin\")"
            echo "conflicts=(\"\$_bin\")"
            if [ -n "$SHA_X86" ]; then
              echo "source_x86_64=(\"${RELEASE_URL}/v\${pkgver}/${X86_FILE}\")"
              echo "sha256sums_x86_64=('${SHA_X86}')"
            fi
            if [ -n "$SHA_ARM64" ]; then
              echo "source_aarch64=(\"${RELEASE_URL}/v\${pkgver}/${ARM64_FILE}\")"
              echo "sha256sums_aarch64=('${SHA_ARM64}')"
            fi
            echo ""
            echo "package() {"
            echo "  install -Dm755 \"\$_bin\" \"\$pkgdir/usr/bin/\$_bin\""
            # makepkg runs with errexit — `[ -f x ] && cmd` fails the whole
            # function (via `&&`'s exit status) when the file is absent, so
            # every optional install uses an explicit if/then instead. These
            # paths exist in hoppy's tarballs (root-level completions/ and
            # man/) and are absent for hyalo/ff-rdp; the conditionals let one
            # PKGBUILD serve all three.
            echo "  if [ -f LICENSE ]; then"
            echo "    install -Dm644 LICENSE \"\$pkgdir/usr/share/licenses/\$pkgname/LICENSE\""
            echo "  fi"
            echo "  if [ -f README.md ]; then"
            echo "    install -Dm644 README.md \"\$pkgdir/usr/share/doc/\$pkgname/README.md\""
            echo "  fi"
            echo "  if [ -f \"completions/\$_bin.bash\" ]; then"
            echo "    install -Dm644 \"completions/\$_bin.bash\" \"\$pkgdir/usr/share/bash-completion/completions/\$_bin\""
            echo "  fi"
            echo "  if [ -f \"completions/_\$_bin\" ]; then"
            echo "    install -Dm644 \"completions/_\$_bin\" \"\$pkgdir/usr/share/zsh/site-functions/_\$_bin\""
            echo "  fi"
            echo "  if [ -f \"completions/\$_bin.fish\" ]; then"
            echo "    install -Dm644 \"completions/\$_bin.fish\" \"\$pkgdir/usr/share/fish/vendor_completions.d/\$_bin.fish\""
            echo "  fi"
            echo "  if compgen -G \"man/*.1\" > /dev/null; then"
            echo "    for m in man/*.1; do"
            echo "      install -Dm644 \"\$m\" \"\$pkgdir/usr/share/man/man1/\$(basename \"\$m\")\""
            echo "    done"
            echo "  fi"
            echo "}"
          } > PKGBUILD

          cat PKGBUILD

      - name: Publish to AUR
        # First push auto-creates the AUR package. The AUR account owning
        # aur-ssh-private-key's public counterpart must already have that
        # public key registered at https://aur.archlinux.org/account/ (SSH
        # Public Key field) before this can push.
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: ${{ inputs.aur-package }}
          pkgbuild: ./PKGBUILD
          commit_username: "github-actions[bot]"
          commit_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Update ${{ inputs.aur-package }} to ${{ needs.version-check.outputs.version }}"
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # ---------------------------------------------------------------------
  # 12. Cloudsmith (conditional, skipped in dry-run, non-blocking)
  # ---------------------------------------------------------------------
  cloudsmith:
    needs: [release, version-check]
    if: ${{ !cancelled() && needs.release.result == 'success' && inputs.enable-linux-packages && inputs.cloudsmith-repo != '' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Non-blocking for the same reason as winget/AUR: a Cloudsmith hiccup
    # shouldn't fail a release that already succeeded on GitHub.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify CLOUDSMITH_API_KEY is set
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDSMITH_API_KEY}" ]; then
            echo "ERROR: CLOUDSMITH_API_KEY secret is not set" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # uv only runs a tool here; the caller repos have no Python
          # dependency files, so the cache would never be invalidated.
          enable-cache: false

      # Only this caller's packages: with two callers on one release, the
      # other's may still be uploading, and are not this caller's to push.
      - name: Download deb/rpm packages from release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          BIN_NAME: ${{ inputs.bin-name }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${GITHUB_EVENT_RELEASE_TAG_NAME}" \
            --pattern "${BIN_NAME}-v${VERSION}-*.deb" \
            --pattern "${BIN_NAME}-v${VERSION}-*.rpm" --dir dist

      - name: Push packages to Cloudsmith
        # any-distro/any-version is Cloudsmith's own documented wildcard
        # distribution path for both deb and rpm pushes — see
        # https://docs.cloudsmith.com/formats/debian-repository and
        # https://docs.cloudsmith.com/formats/redhat-repository. It accepts
        # any Debian/RedHat-family installer without pinning to one distro
        # release, which is the right default for a generically-built
        # cargo-deb/cargo-generate-rpm package.
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CLOUDSMITH_REPO: ${{ inputs.cloudsmith-repo }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in dist/*.deb; do
            echo "Pushing $f to ${CLOUDSMITH_REPO}/any-distro/any-version..."
            uvx --from cloudsmith-cli==1.19.0 cloudsmith push deb "${CLOUDSMITH_REPO}/any-distro/any-version" "$f"
          done
          for f in dist/*.rpm; do
            echo "Pushing $f to ${CLOUDSMITH_REPO}/any-distro/any-version..."
            uvx --from cloudsmith-cli==1.19.0 cloudsmith push rpm "${CLOUDSMITH_REPO}/any-distro/any-version" "$f"
          done
