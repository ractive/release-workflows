# Self-check: lint this repo's own workflow files with actionlint (syntax +
# shellcheck) and zizmor (GitHub Actions security static analysis), and the
# composite action setup/action.yml with zizmor and shellcheck (actionlint
# reads workflows only), on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/3795ba2f6cb243eeca54c9d22e5c531cb9dcfb4a/scripts/download-actionlint.bash) 1.7.12
        # Pinned download script commit + pinned actionlint version for
        # reproducibility. See https://github.com/rhysd/actionlint releases.

      - name: Run actionlint
        run: ./actionlint -color

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # uv only runs a tool here; the caller repos have no Python
          # dependency files, so the cache would never be invalidated.
          enable-cache: false

      - name: Run zizmor
        # Version pinned via `--from zizmor==<version>`; suppressions (if
        # any) live in the committed zizmor.yml, each with a comment
        # explaining why it's a deliberate exception and not a blanket skip.
        run: uvx --from zizmor==1.32.0 zizmor --config zizmor.yml .github/workflows/ setup/action.yml

  shellcheck-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck setup/action.yml's script
        # yq (mikefarah) and shellcheck are preinstalled on ubuntu-latest.
        # actionlint runs shellcheck on workflow steps only, not on a
        # composite action's.
        run: |
          set -euo pipefail
          yq -e '.runs.steps[] | select(.id == "install") | .run' setup/action.yml > "$RUNNER_TEMP/install.sh"
          shellcheck --version
          shellcheck -s bash "$RUNNER_TEMP/install.sh"
