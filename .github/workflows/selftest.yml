# End-to-end integration test for release.yml. Calls the reusable workflow
# from THIS repo (uses: ./.github/workflows/release.yml is valid for
# workflow_call and runs at the triggering commit's SHA), pointed at the
# fixture crate under testdata/fixture-cli, in dry-run mode. This exercises
# the real build/test/archive/SBOM/deb-rpm/SHA256SUMS/dry-run-summary code
# paths on every PR without touching crates.io, Homebrew, Scoop, winget, or
# any app repo.
#
# Two callers run in one workflow run, as in a repository that releases two
# binaries: `selftest-two` (bin-name fixture-cli-two, its own checksums file)
# and then `selftest` (bin-name fixture-cli, a prefix of the other's). The
# order is deliberate: when `selftest` collects its artifacts, the other
# caller's are already in the run and match `fixture-cli-*`, so its filter
# has something to drop. `two-callers` checks that each bundle holds only
# its own files and checksums.
name: Selftest

on:
  push:
    branches: [main]
  pull_request:

# contents: write, not read: GitHub validates reusable-workflow permissions
# EAGERLY at startup — the called release job requests contents: write, and
# the caller must grant at least that even though dry-run skips the job
# (verified: a contents: read grant produces startup_failure). Note fork PRs
# get write silently downgraded to read, so selftest would startup-fail for
# forks; acceptable for this single-maintainer infra repo.
permissions:
  contents: write

concurrency:
  group: selftest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The second caller: Linux only, no deb/rpm, its own checksums file.
  selftest-two:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      bin-name: fixture-cli-two
      version-package: fixture-cli
      workspace-dir: testdata/fixture-cli
      checksums-file: SHA256SUMS-fixture-cli-two
      dry-run: true
      enable-sbom: true
      enable-attestation: false
      targets: >-
        [
          {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-latest", "cross": false, "run_tests": true}
        ]

  selftest:
    needs: selftest-two
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      bin-name: fixture-cli
      version-package: fixture-cli
      workspace-dir: testdata/fixture-cli
      dry-run: true
      enable-sbom: true
      enable-attestation: false
      enable-linux-packages: true
      linux-package-crate: fixture-cli
      # Deliberately multi-line: guards the eval-based execution of this
      # input (a bare ${VAR} expansion once flattened the newlines into one
      # giant argument list — real bug caught by hoppy's first dry-run).
      pre-package-command: |
        mkdir -p extras
        echo "target=$TARGET cross=$CROSS version=$VERSION bin=$BIN_PATH" > extras/buildinfo.txt
        if [ "$CROSS" != "true" ]; then
          # Validates that BIN_PATH resolves to a runnable binary on native
          # targets (including .exe resolution on Windows).
          "$BIN_PATH" --version >> extras/buildinfo.txt
        fi
      extra-archive-paths: extras
      # One target per distinct code path: native Linux build+test, a cross
      # (containerized) Linux build to exercise the cross/Cross.toml path,
      # a native macOS build, and the Windows zip-archive path.
      targets: >-
        [
          {"target": "x86_64-unknown-linux-gnu",  "os": "ubuntu-latest",  "cross": false, "run_tests": true},
          {"target": "x86_64-unknown-linux-musl", "os": "ubuntu-latest",  "cross": true,  "run_tests": true},
          {"target": "aarch64-apple-darwin",      "os": "macos-latest",  "cross": false, "run_tests": true},
          {"target": "x86_64-pc-windows-msvc",    "os": "windows-latest", "cross": false, "run_tests": true}
        ]

  # The selftest passes no secrets, so the macOS signing steps must have
  # skipped: the archived binary carries only the linker's ad-hoc
  # signature, no Developer ID. This is the "no Apple secrets" path every
  # release takes until the owner adds them (docs/macos-signing.md).
  macos-unsigned:
    needs: selftest
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Download the macOS archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fixture-cli-aarch64-apple-darwin
          path: artifact

      - name: Check the binary is not Developer ID signed
        shell: bash
        run: |
          set -euo pipefail
          mkdir unpacked
          tar xzf artifact/fixture-cli-v*-aarch64-apple-darwin.tar.gz -C unpacked
          codesign --display --verbose=2 unpacked/fixture-cli 2>&1 | tee codesign.txt
          grep -q '^Signature=adhoc' codesign.txt
          if grep -q '^Authority=' codesign.txt; then
            echo "ERROR: the binary is signed with a certificate although no Apple secrets were passed" >&2
            exit 1
          fi

  # Each caller's dry-run bundle has its own name, only its own files and
  # its own checksums file, which covers exactly those files.
  two-callers:
    needs: [selftest, selftest-two]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download both bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dry-run-bundle-*
          path: bundles

      - name: Check each bundle
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local bin="$1" sums="$2" other_sums="$3" dir="bundles/dry-run-bundle-$1"
            echo "== $dir"
            ls -1 "$dir"
            [ -f "$dir/$sums" ] || { echo "ERROR: $dir has no $sums" >&2; exit 1; }
            [ ! -e "$dir/$other_sums" ] || { echo "ERROR: $dir has $other_sums" >&2; exit 1; }
            for f in "$dir"/*; do
              f=$(basename "$f")
              case "$f" in
                "$sums"|"${bin}-v0.0.1-"*) ;;
                *) echo "ERROR: $dir holds $f, not $bin's" >&2; exit 1 ;;
              esac
            done
            # Every file but the checksums file is listed, and nothing else.
            listed=$(awk '{print $2}' "$dir/$sums" | sort)
            present=$(for f in "$dir"/*; do f=$(basename "$f"); [ "$f" = "$sums" ] || echo "$f"; done | sort)
            [ "$listed" = "$present" ] || { echo "ERROR: $sums does not list exactly the bundle's files" >&2; exit 1; }
            (cd "$dir" && sha256sum -c "$sums")
          }
          check fixture-cli SHA256SUMS SHA256SUMS-fixture-cli-two
          check fixture-cli-two SHA256SUMS-fixture-cli-two SHA256SUMS
