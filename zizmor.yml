# zizmor (https://docs.zizmor.sh) security-lint configuration for this repo's
# own workflow files. Suppressions below are deliberate, reviewed exceptions
# — not blanket rule disables. Every other finding zizmor reports must be
# fixed, not suppressed (see .github/workflows/ci.yml, which runs zizmor with
# this config on every push/PR).
rules:
  use-trusted-publishing:
    ignore:
      # Both files publish to crates.io with a long-lived CARGO_TOKEN
      # (secrets.CARGO_TOKEN) rather than crates.io's OIDC-based trusted
      # publishing. Trusted publishing requires configuring a per-crate trust
      # relationship on crates.io itself for hyalo-core, hyalo-mdlint,
      # hyalo-cli, bunny-net-api, bunny-syslog-receiver, hoppy-cli,
      # ff-rdp-core, and ff-rdp-cli (eight crates across three repos, each
      # needing an owner with publish rights on crates.io to opt in) — that's
      # a real migration for a follow-up PR, not something this workflow
      # authoring pass can do unilaterally. Tracked as a known gap, not a
      # false positive.
      - publish-crates.yml
      - release.yml
  self-repository:
    ignore:
      # zizmor 1.30+ asks for GitHub's July-2026 `uses: $/...` self-repository
      # syntax instead of `uses: ./...` for selftest.yml's two calls of
      # release.yml. actionlint 1.7.12 (the latest release, also run by
      # ci.yml) rejects `$/` as an invalid reusable-workflow reference
      # (rhysd/actionlint#711, #760), so the two linters cannot both pass.
      # Both are job-level reusable-workflow calls, which GitHub resolves
      # from the repository at the workflow run's own commit, not from a
      # checked-out workspace, so `./` cannot be redirected here. Switch to
      # `$/` once actionlint accepts it.
      - selftest.yml:43
      - selftest.yml:61
      # The same for the CRX selftest's call of chrome-extension-publish.yml.
      - selftest.yml:242
      # And the Edge selftest's call of edge-extension-publish.yml.
      - selftest.yml:256
      # setup-selftest.yml runs setup/action.yml, the composite action under
      # test, as `uses: ./setup` in every job. actionlint 1.7.12 rejects
      # `$/setup` for a step as well ("ref is missing"), so the same conflict
      # as above. Each job's only checkout is the default one (the run's own
      # commit, persist-credentials: false) and no step writes to the
      # workspace before `./setup` is used, so `./` names this commit's action.
      - setup-selftest.yml
  github-env:
    ignore:
      # setup/action.yml exists to put the binary it installed on PATH: its
      # one GITHUB_PATH write is the tool-cache directory it extracted the
      # verified archive into, a path made of RUNNER_TOOL_CACHE and the
      # validated repo, bin, tag and target. Nothing attacker-controlled
      # reaches it unvalidated, and the archive is only extracted there after
      # its SHA256SUMS check and attestation verification. (zizmor matches
      # ignores by base name; setup/action.yml is this repo's only action.yml.)
      - action.yml
